minimumReleaseAge: 1440 # minutes = 1 day
minimumReleaseAgeExcludePrune: true
trustPolicy: no-downgrade
autoInstallPeers: false # Why pnpm? Why?
shellEmulator: true

packages:
  - 'packages/*'
  - docs

allowBuilds:
  esbuild: true
minimumReleaseAgeExclude:
  # Renovate security update: vite@8.2.4
  - vite@8.2.4
