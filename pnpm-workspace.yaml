# Examples install a copy of published files for fluent-vue and unplugin-fluent-vue
dedupeInjectedDeps: false

# Refresh the examples' injected copies after a package rebuilds
syncInjectedDepsAfterScripts:
  - build

minimumReleaseAge: 1440 # minutes = 1 day
minimumReleaseAgeExcludePrune: true
trustPolicy: no-downgrade
autoInstallPeers: false # Why pnpm? Why?
shellEmulator: true

packages:
  - 'packages/*'
  - docs
  - 'examples/*'

allowBuilds:
  esbuild: true
