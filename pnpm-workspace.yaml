minimumReleaseAge: 1440 # minutes = 1 day
minimumReleaseAgeExcludePrune: true
trustPolicy: no-downgrade
autoInstallPeers: false # Why pnpm? Why?
shellEmulator: true

packages:
  - 'packages/*'
  - docs

allowBuilds:
  esbuild: true
minimumReleaseAgeExclude:
  # Renovate security update: vitest@4.1.11
  - vitest@4.1.11
